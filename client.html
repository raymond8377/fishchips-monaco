<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Écran client">
<meta name="theme-color" content="#4a1020">
<meta name="robots" content="noindex, nofollow">
<title>Écran client · Fish &amp; Chips</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none;background:#2a0912;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:4vmin 5vmin}
.brand{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:3.2vmin;opacity:.75;display:flex;justify-content:space-between}
.brand small{font-weight:600;letter-spacing:.1em}
/* Accueil */
.idle{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#5a1426,#2a0912 70%)}
.idle h1{font-size:11vmin;margin:0;line-height:1;font-weight:800;letter-spacing:.02em}
.idle h1 span{color:#e3b42a}
.idle p{font-size:4vmin;opacity:.8;margin:2vmin 0 0}
/* Panier */
.lines{flex:1;overflow:hidden;margin:3vmin 0;display:flex;flex-direction:column;gap:1.6vmin;justify-content:flex-end}
.ln{display:flex;align-items:baseline;gap:2vmin;font-size:4.6vmin;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:1.4vmin}
.ln .q{font-weight:800;color:#e3b42a;min-width:6vmin}
.ln .nm{flex:1;min-width:0}
.ln .nm small{display:block;font-size:3vmin;opacity:.7}
.ln .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{background:#fff;color:#2a0912;border-radius:2.4vmin;padding:2.6vmin 4vmin;display:flex;align-items:center;justify-content:space-between}
.tot span{font-size:5vmin;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tot b{font-size:13vmin;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
/* Payé */
.paid{align-items:center;justify-content:center;text-align:center;background:#1f5c3c}
.paid .ok{font-size:7vmin;font-weight:800}
.paid .lbl{font-size:4vmin;opacity:.85;margin-top:3vmin;text-transform:uppercase;letter-spacing:.1em}
.paid .num{font-size:24vmin;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.paid .pg{font-size:5vmin;font-weight:700;background:rgba(0,0,0,.25);border-radius:999px;padding:1vmin 4vmin;margin-top:2vmin}
.paid .rd{font-size:5vmin;margin-top:3vmin;font-weight:700}
/* Code */
.login{align-items:center;justify-content:center;gap:16px;text-align:center}
.login input{font-size:28px;padding:12px 16px;border-radius:12px;border:0;width:220px;text-align:center}
.login button{font-size:20px;padding:12px 28px;border-radius:12px;border:0;background:#e3b42a;color:#2a0912;font-weight:800}
.err{color:#ffb4a8;min-height:1.2em}
.off{position:fixed;right:12px;bottom:10px;font-size:13px;opacity:.6}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="scr login" id="login" hidden>
  <div class="brand" style="justify-content:center">Écran client</div>
  <p style="margin:0;opacity:.8">Entrez le code cuisine du stand (une seule fois).</p>
  <input id="pin" inputmode="numeric" autocomplete="off" placeholder="Code">
  <button id="go" type="button">Valider</button>
  <div class="err" id="err"></div>
</div>
<div id="view"></div>
<div class="off" id="off" hidden>Connexion…</div>
<script>
const SB_URL='https://cytgdpeoxhxempnewrep.supabase.co';
const SB_KEY='sb_publishable_5nYZv-C8Bfc7AErue3h9-g_D8OUnOOW';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(3,'0');
const eur=n=>{n=Math.round(n*100)/100;return (n<0?'−':'')+(Math.abs(n)%1?Math.abs(n).toFixed(2).replace('.',','):Math.abs(n))+' €'};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let PIN=ls.get('fc-client-pin')||'',last='',lastOk=0;
async function rpc(fn,args){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const t=await r.text();if(!r.ok)throw new Error(t||r.status);return t?JSON.parse(t):null}
const brand='<div class="brand"><span>Fish &amp; Chips</span><small>Monaco · Marché de Noël</small></div>';
function idle(){return `<div class="scr idle"><h1>Fish <span>&amp;</span> Chips</h1><p>Bienvenue ! Commandez au comptoir</p></div>`}
function render(d,at){
  let h;
  if(!d||d.s==='idle')h=idle();
  else if(d.s==='paid'){
    if(Date.now()-at>25000)h=idle();
    else h=`<div class="scr paid"><div class="ok">✓ Merci !</div>${d.n?`<div class="lbl">Votre numéro</div><div class="num">${pad(d.n)}</div>${d.pager?`<div class="pg">Bipeur ${esc(d.pager)}</div>`:''}`:''}${d.rendu?`<div class="rd">Rendu : ${eur(d.rendu)}</div>`:''}</div>`}
  else{
    const L=(d.lines||[]).slice(-7);
    h=`<div class="scr">${brand}<div class="lines">${(d.lines||[]).length>7?'<div class="ln" style="opacity:.6"><span class="nm">…</span></div>':''}${L.map(l=>`<div class="ln"><span class="q">${l.q}×</span><span class="nm">${esc(l.name)}${l.opts?`<small>${esc(l.opts)}</small>`:''}</span><span class="p">${eur(l.p)}</span></div>`).join('')}</div>
      <div class="tot"><span>Total</span><b>${eur(d.total)}</b></div></div>`}
  if(h!==last){$('#view').innerHTML=h;last=h}
}
async function poll(){
  if(!PIN)return;
  try{const r=await rpc('fc_get_display',{p_pin:PIN});lastOk=Date.now();render(r&&r.data,r?r.at:0)}
  catch(e){if(String(e.message).includes('invalide')){PIN='';ls.set('fc-client-pin','');showLogin('Code refusé')}}
  $('#off').hidden=Date.now()-lastOk<8000;
}
function showLogin(m){$('#login').hidden=false;$('#view').innerHTML='';last='';$('#err').textContent=m||''}
$('#go').onclick=async()=>{const v=$('#pin').value.trim();if(!v)return;
  try{const role=await rpc('fc_ping',{p_pin:v});if(role==='refuse'){$('#err').textContent='Code incorrect';return}
    PIN=v;ls.set('fc-client-pin',v);$('#login').hidden=true;poll()}catch(e){$('#err').textContent='Pas de réseau'}};
let wl;async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
document.addEventListener('click',wake);
if(PIN){render(null,0);poll()}else showLogin();
wake();setInterval(poll,1200);
/* Écran verrouillé pour les clients : pas de zoom, pas de menu, pas de défilement */
['contextmenu','gesturestart','dblclick','selectstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
</script>
</body>
</html>
