<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Menu · Fish &amp; Chips Monaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--red:#8b0000;--cream:#f6e7d2;--ink:#0d0d0d;--gold:#c9a45a}
html,body{margin:0;height:100%;overflow:hidden;background:var(--red)}
body{background:radial-gradient(ellipse at 50% 35%,#9e0d0d 0%,#8b0000 45%,#5e0000 100%)}
body{color:var(--cream);font-family:"Libre Baskerville",Georgia,"Times New Roman",serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease;display:flex;align-items:center;justify-content:center;padding:5vmin 6vmin}
.sl.on{opacity:1}
/* Diapo produit */
.prod{display:grid;grid-template-columns:1.15fr 1fr;gap:5vmin;align-items:center;width:100%;height:100%}
@media (orientation:portrait){.prod{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:4vmin}}
.frame{border:.5vmin solid var(--cream);padding:1vmin;background:var(--red);box-shadow:0 0 0 .25vmin var(--gold),0 3vmin 6vmin rgba(0,0,0,.45);outline:.15vmin solid var(--gold);outline-offset:-1.6vmin}
.prod.sq .frame img,.frame.sqf img{aspect-ratio:1/1}
.prod.sq{grid-template-columns:.85fr 1fr}
.prod.sq .frame,.frame.sqf{max-height:76vh;aspect-ratio:auto}
.prod.sq .frame img,.frame.sqf img{max-height:calc(76vh - 3vmin);width:auto;max-width:100%;margin:auto}
.frame img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.info{display:flex;flex-direction:column;gap:1.8vmin;min-width:0}
.tag{align-self:flex-start;background:var(--cream);color:var(--red);box-shadow:0 0 0 .2vmin var(--gold);border-radius:1.4vmin;padding:1vmin 2.4vmin;font-size:2.8vmin;letter-spacing:.06em;text-transform:uppercase}
.nm{text-shadow:0 .4vmin 1.6vmin rgba(0,0,0,.35);font-size:6.4vmin;font-weight:700;line-height:1.08;text-decoration:underline;text-decoration-thickness:.35vmin;text-underline-offset:1vmin}
.sub{font-size:3.6vmin;line-height:1.3}
.en{display:flex;align-items:center;gap:1.6vmin;font-style:italic;font-size:2.4vmin;opacity:.95}
.flag{width:4.4vmin;height:auto;flex:none;border-radius:.4vmin}
.prices{display:flex;gap:2.6vmin;flex-wrap:wrap;align-items:flex-end;margin-top:1vmin}
.pz{display:flex;flex-direction:column;align-items:center;gap:1vmin}
.pz small{font-size:2.4vmin;text-align:center;line-height:1.2}
/* Étiquette noire coins découpés, comme la carte */
.tk{--n:2.6vmin;background:linear-gradient(180deg,#1b1b1b,#050505);color:#fff;padding:1.6vmin 3.6vmin;text-align:center;min-width:20vmin;
  -webkit-mask:radial-gradient(circle var(--n) at 0 0,#0000 98%,#000) top left,radial-gradient(circle var(--n) at 100% 0,#0000 98%,#000) top right,radial-gradient(circle var(--n) at 0 100%,#0000 98%,#000) bottom left,radial-gradient(circle var(--n) at 100% 100%,#0000 98%,#000) bottom right;
  -webkit-mask-size:51% 51%;-webkit-mask-repeat:no-repeat;
  mask:radial-gradient(circle var(--n) at 0 0,#0000 98%,#000) top left,radial-gradient(circle var(--n) at 100% 0,#0000 98%,#000) top right,radial-gradient(circle var(--n) at 0 100%,#0000 98%,#000) bottom left,radial-gradient(circle var(--n) at 100% 100%,#0000 98%,#000) bottom right;
  mask-size:51% 51%;mask-repeat:no-repeat}
.tk b{display:block;font-size:8vmin;line-height:1.05;font-weight:400}
.tk span{display:block;font-size:2.2vmin;opacity:.9}
.tk em{display:block;font-style:normal;font-size:4.2vmin}
.spicy{font-size:2.6vmin;letter-spacing:.04em}
/* Listes (fritures, frites, boissons) */
.list{width:min(100%,150vmin);display:flex;flex-direction:column;gap:3vmin}
.list .tag{font-size:4vmin;padding:1.4vmin 3.2vmin}
.li{display:flex;align-items:center;gap:3vmin;font-size:5vmin;border-bottom:.2vmin dashed rgba(246,231,210,.35);padding-bottom:2vmin}
.li .n{flex:1;line-height:1.2}
.li .n small{display:block;font-size:2.6vmin;font-style:italic;opacity:.85;margin-top:.6vmin}
.li .tk{min-width:16vmin;padding:1.2vmin 2.6vmin}
.li .tk b{font-size:5.6vmin}
.combo{display:grid;grid-template-columns:.8fr 1.1fr;gap:5vmin;align-items:center;width:100%}
@media (orientation:portrait){.combo{grid-template-columns:1fr}}
/* Accueil et carte */
.logo{width:min(55vmin,65%);height:auto}
.carte{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.sl.full{padding:0}
body::before{content:'';position:fixed;inset:1.6vmin;border:.25vmin solid var(--gold);pointer-events:none;z-index:4}
body::after{content:'';position:fixed;inset:2.6vmin;border:.12vmin solid rgba(201,164,90,.6);pointer-events:none;z-index:4}
.sl.full::after{display:none}
.side{display:flex;align-items:center;justify-content:center}.side img{width:100%;max-width:56vmin;height:auto}
.dots{position:fixed;left:50%;bottom:2vmin;transform:translateX(-50%);display:flex;gap:1.2vmin;z-index:5}
.dots i{width:1.2vmin;height:1.2vmin;border-radius:50%;background:rgba(246,231,210,.35)}
.dots i.on{background:var(--cream)}
.cfg{position:fixed;inset:0;z-index:20;background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;font-family:-apple-system,Roboto,Arial,sans-serif}
.cfg input{font-size:26px;padding:12px;border-radius:12px;border:0;width:220px;text-align:center}
.cfg button{font-size:18px;padding:12px 22px;border-radius:12px;border:0;background:var(--cream);color:var(--red);font-weight:800}
.cfg .ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
[hidden]{display:none!important}

.sl .frame{transform:scale(.96);transition:transform 9s ease-out}.sl.on .frame{transform:scale(1)}
.sl .info>*,.sl .list>*{opacity:0;transform:translateY(2vmin);transition:opacity 1.2s ease,transform 1.2s ease}
.sl.on .info>*,.sl.on .list>*{opacity:1;transform:none}
.sl.on .info>*:nth-child(2),.sl.on .list>*:nth-child(2){transition-delay:.25s}.sl.on .info>*:nth-child(3),.sl.on .list>*:nth-child(3){transition-delay:.45s}
.sl.on .info>*:nth-child(4),.sl.on .list>*:nth-child(4){transition-delay:.65s}.sl.on .info>*:nth-child(5),.sl.on .list>*:nth-child(5){transition-delay:.85s}.sl.on .info>*:nth-child(n+6),.sl.on .list>*:nth-child(n+6){transition-delay:1.05s}
.badges{display:flex;flex-wrap:wrap;gap:1.4vmin;margin-top:.6vmin}
.bd{white-space:nowrap;display:inline-flex;align-items:center;gap:1vmin;border:.18vmin solid var(--gold);color:var(--cream);border-radius:999px;padding:.8vmin 2vmin;font-size:2.2vmin;letter-spacing:.04em;background:rgba(0,0,0,.18)}
.bd i{font-style:normal;color:var(--gold)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:3}
.foot{position:fixed;left:0;right:0;bottom:9vmin;text-align:center;font-style:italic;font-size:3.2vmin;color:var(--gold);letter-spacing:.06em;z-index:5;transition:opacity 1.5s}
@media (prefers-reduced-motion:reduce){.sl .frame,.sl .info>*,.sl .list>*{transition:none}}

.prod2{display:flex;flex-direction:column;width:100%;height:100%;gap:2.6vmin;padding:1vmin 0 5vmin}
.prod2 .head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.2vmin}
.prod2 .head .tag{align-self:center;font-size:2.4vmin}
.prod2 .nm{font-size:5.6vmin}
.prod2 .sub{font-size:3vmin}
.prod2 .body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:5vmin}
.prod2 .frame{flex:none}
.prod2 .frame img{height:min(46vh,40vw);width:auto;aspect-ratio:16/10}
.prod2.sq .frame img{aspect-ratio:1/1;height:min(46vh,36vw)}
.prod2 .info{gap:1.8vmin;max-width:46vw}
.prod2 .tk b{font-size:7vmin}
@media (orientation:portrait){
  .prod2 .body{flex-direction:column;gap:3vmin}
  .prod2 .frame img{height:auto;width:min(82vw,60vh);max-height:34vh;object-fit:cover}
  .prod2.sq .frame img{width:auto;height:min(32vh,70vw)}
  .prod2 .info{max-width:none;align-items:center;text-align:center}
  .prod2 .info .en,.prod2 .badges,.prod2 .prices{justify-content:center}
  .prod2 .nm{font-size:6.4vmin}
}

@media (orientation:portrait){.combo{gap:3vmin}.combo .frame{justify-self:center}.combo .frame img{height:min(26vh,60vw)!important;width:auto!important;max-height:none!important}.li{font-size:4.4vmin;padding-bottom:1.4vmin}.list{gap:2vmin}}
.combo .frame.sqf img{height:min(56vh,34vw);width:auto;max-height:none}

.carte2{width:100%;height:100%;display:flex;flex-direction:column;gap:2.4vmin;padding:0 0 4vmin}
.carte2 .ch{display:flex;align-items:center;justify-content:center;gap:3vmin}
.carte2 .ch img{height:14vmin;width:auto}
.carte2 .ch b{display:block;font-size:6vmin;line-height:1}
.carte2 .ch span{display:block;font-size:2.3vmin;font-style:italic;color:var(--gold);margin-top:1vmin}
.carte2 .cg{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:2vmin}
.cc{display:flex;align-items:center;gap:2vmin;background:none;border:0;padding:1.2vmin;min-height:0;overflow:hidden}
.cc img{height:100%;max-height:17vmin;aspect-ratio:1/1;width:auto;object-fit:cover;border-radius:1.4vmin;border:0;box-shadow:0 1.2vmin 3vmin rgba(0,0,0,.35);flex:none}
.ct{display:flex;flex-direction:column;gap:.8vmin;min-width:0}
.ct b{font-size:2.9vmin;line-height:1.15;font-weight:700}
.ct b i{font-weight:400;font-size:2.2vmin}
.cp{font-size:4.4vmin;color:#fff;line-height:1}
.cp em{font-style:normal;opacity:.6;margin:0 .8vmin}
.cp small{display:block;font-size:2vmin;color:var(--cream);opacity:.85;margin-top:.6vmin;font-style:italic}
@media (orientation:portrait){.carte2 .cg{grid-template-columns:repeat(2,1fr)}.cc img{max-height:14vmin}.ct b{font-size:3.2vmin}.cp{font-size:4.6vmin}}

@media (orientation:landscape){.cg .cc:last-child:nth-child(3n+1){grid-column:1/-1;justify-content:center}.cg .cc:nth-last-child(2):nth-child(3n+1){grid-column:span 1}.cg .cc:last-child:nth-child(3n+2){grid-column:span 2;justify-content:center}}
@media (orientation:portrait){.cg .cc:last-child:nth-child(odd){grid-column:1/-1;justify-content:center}}

/* Carte : plats fondus dans le fond, sans cadre */
.cc img{border:0!important;box-shadow:none!important;border-radius:0!important}
.cc img{aspect-ratio:auto!important;width:24vmin!important;height:auto!important;max-height:17vmin!important;object-fit:contain!important;
  -webkit-mask-image:radial-gradient(ellipse 58% 58% at 50% 50%,#000 48%,transparent 98%)!important;mask-image:radial-gradient(ellipse 58% 58% at 50% 50%,#000 48%,transparent 98%)!important}
@media (orientation:portrait){.cc img{width:22vmin!important}}
</style>
</head>
<body>
<div id="show"></div>
<canvas id="snow"></canvas>
<div class="foot" id="foot"></div>
<div class="dots" id="dots"></div>
<div class="cfg" id="cfg" hidden>
  <b style="font-size:22px">Écran menu</b>
  <p style="margin:0;opacity:.85;max-width:420px">Entrez le code cuisine pour que les prix suivent ceux de la caisse.<br>Sans code, les prix de la carte s'affichent.</p>
  <input id="pin" inputmode="numeric" autocomplete="off" placeholder="Code">
  <div style="display:flex;gap:10px"><button class="ghost" id="skip" type="button">Sans code</button><button id="go" type="button">Valider</button></div>
  <div id="err" style="color:#ffd0c8;min-height:1.2em"></div>
</div>
<script>
const SB_URL='https://cytgdpeoxhxempnewrep.supabase.co';
const SB_KEY='sb_publishable_5nYZv-C8Bfc7AErue3h9-g_D8OUnOOW';
const A='assets/';
const FLAG='<svg class="flag" viewBox="0 0 60 30"><clipPath id="c"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#c)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>';
/* Prix de la carte (repris de la caisse quand le code est entré) */
const DEF={'cab.formule':17,'cab.seul':11,'aig.formule':16,'aig.seul':9,'shk.formule':15,'shk.seul':11,enc:10,sj:16,
 'mix.formule':null,'mix.seul':null,'sal.pain':null,'sal.bqf':null,'sal.bq':null,pf:5,gf:8,beer:3,eau:3,soda:4,ft:4,spicy:1,cheddar:2,cup:2};
let P=Object.assign({},DEF);
const $=s=>document.querySelector(s);
const eur=n=>(n%1?(+n).toFixed(2).replace('.',','):n)+'€';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let PIN=ls.get('fc-menu-pin');
const has=k=>P[k]!=null;
const tk=(k,label)=>has(k)?`<div class="tk"><b>${eur(+P[k])}</b>${label?`<span>${label}</span>`:''}</div>`:'';
function lay(img,sq,tagTxt,name,sub,inner){
  return `<div class="prod2 ${sq?'sq':''}"><div class="head"><span class="tag">${tagTxt}</span><div class="nm">${name}</div><div class="sub">${sub}</div></div>
   <div class="body"><div class="frame"><img src="${A}${img}" alt=""></div><div class="info">${inner}</div></div></div>`}
function fishSlide(img,tagTxt,name,sub,en,kf,ks){
  if(!has(kf)&&!has(ks))return '';
  return lay(img,0,tagTxt,name,sub,`<div class="en">${FLAG}<span>${en}</span></div>
   <div class="prices">${has(kf)?`<div class="pz"><small>Formule poisson<br>+ grande frite</small><div class="tk"><b>${eur(+P[kf])}</b>${has(ks)?`<span>Poisson seul :</span><em>${eur(+P[ks])}</em>`:''}</div></div>`:tk(ks,'Poisson seul')}</div>
   <div class="spicy">🌶️ Spicy version en supplément +${eur(+P.spicy)}</div>${BD(PECHE,'Frites maison faites sur place')}`)}
const BD=(...a)=>`<div class="badges">${a.map(x=>`<span class="bd"><i>✦</i>${x}</span>`).join('')}</div>`;
const PECHE='Issu de la pêche durable';
const SP=()=>`<div class="spicy">🌶️ Spicy version en supplément +${eur(+P.spicy)}</div>`;
function itemSlide(img,sq,tagTxt,name,sub,en,prices,extra){
  if(!prices)return '';
  return lay(img,sq,tagTxt,name,sub,`${en?`<div class="en">${FLAG}<span>${en}</span></div>`:''}<div class="prices">${prices}</div>${extra||''}`)}
const pz=(label,k)=>has(k)?`<div class="pz"><small>${label}</small>${tk(k)}</div>`:'';
function carteHTML(){
  const pr=(k)=>has(k)?eur(+P[k]):'';
  const c=(img,name,main,sub)=>main?`<div class="cc"><img src="${A}${img}" alt=""><div class="ct"><b>${name}</b><span class="cp">${main}${sub?`<small>${sub}</small>`:''}</span></div></div>`:'';
  const fs=(k)=>has(k+'.formule')?pr(k+'.formule'):pr(k+'.seul');
  const fsub=(k)=>has(k+'.formule')&&has(k+'.seul')?`seul ${pr(k+'.seul')}`:'';
  const items=[
    c('cabillaud.webp','Fish &amp; chips cabillaud',fs('cab'),fsub('cab')),
    c('aiguillettes.webp',"Aiguillettes de colin",fs('aig'),fsub('aig')),
    c('nuggets.webp',"Shunk de colin",fs('shk'),fsub('shk')),
    c('encornets.jpg','Calamars <i>· 5 pcs</i>',pr('enc')),
    c('c-sj.webp','Saint-Jacques',pr('sj')),
    c('c-mix.jpg','Mix Box',fs('mix'),fsub('mix')),
    c('c-sal.jpg','Saumon planche',pr('sal.pain')||pr('sal.bqf'),''),
    c('c-frites.webp','Frites maison',has('pf')?`${pr('pf')}<em>/</em>${pr('gf')}`:pr('gf'),`petite / grande · cheddar +${eur(+P.cheddar)}`),
    c('c-soda.jpg','Boissons',`${pr('eau')}<em>–</em>${pr('soda')}`,has('beer')?`bière Eco Cup ${eur(+P.beer+(+P.cup||0))}`:'')
  ].filter(Boolean).join('');
  return `<div class="carte2"><div class="ch"><img src="${A}logo-clair.png" alt=""><div><b>La carte</b><span>Formule = poisson + grande frite · 🌶️ spicy +${eur(+P.spicy)}</span></div></div><div class="cg">${items}</div></div>`}
function build(){
  const S=[];
  S.push({full:1,h:`<img class="logo" src="${A}logo-clair.png" alt="Fish & Chips · Christmas Market Monaco">`});
  S.push({h:fishSlide('cabillaud.webp','Fish and chips','Fish and chips de cabillaud','Accompagné de frites et sauce tartare maison','Cod fish and chips served with fries and homemade tartar sauce','cab.formule','cab.seul')});
  S.push({h:fishSlide('aiguillettes.webp','Fish and chips',"Aiguillettes de colin d'Alaska",'Façon fish &amp; chips, accompagné de frites et sauce tartare maison','Alaska pollock fillets fish and chips served with fries and homemade tartar sauce','aig.formule','aig.seul')});
  S.push({h:fishSlide('nuggets.webp','Fish and chips',"Shunk de colin d'Alaska","Nuggets de colin d'Alaska façon fish and chips, sauce au choix",'Chunks Alaska pollock nuggets, fish and chips style, with your choice of sauce','shk.formule','shk.seul')});
  S.push({h:itemSlide('encornets.jpg',0,'Fritures de la mer','Calamars façon fish and chips','5 pièces, sauce tartare maison et citron','Squid rings, fish and chips style',pz('La barquette','enc'),SP()+BD(PECHE))});
  S.push({h:itemSlide('c-sj.webp',1,'Fritures de la mer','Saint-Jacques façon fish and chips','Noix de Saint-Jacques croustillantes, sauce tartare maison','Crispy scallops, fish and chips style',pz('La barquette','sj'),SP()+BD(PECHE))});
  S.push({h:itemSlide('c-mix.jpg',1,'À partager','Mix Box','Composez votre assortiment : colin, aiguillettes, calamars, Saint-Jacques','Mixed seafood box, your choice',pz('Avec frites','mix.formule')+pz('Sans frites','mix.seul'),SP()+BD(PECHE))});
  S.push({h:itemSlide('c-sal.jpg',1,'Au feu de bois','Saumon planche','Saumon cuit au feu de bois, en pain ou en barquette','Wood-fired salmon, in a sandwich or a tray',pz('En pain','sal.pain')+pz('Barquette + frites','sal.bqf')+pz('Barquette','sal.bq'))});
  S.push({h:itemSlide('c-frites.webp',1,'Frites maison','Nos frites maison','Épluchées, coupées et frites sur place','Homemade fries',pz('Petite','pf')+pz('Grande','gf'),`<div class="spicy"><i>Cheddar fondu</i> + ${eur(+P.cheddar)}</div>`+BD('Faites maison sur place','Pommes de terre du Nord','Produit local'))});
  S.push({h:`<div class="combo"><div class="frame sqf"><img src="${A}c-soda.jpg" alt=""></div><div class="list"><span class="tag">Les boissons</span>
    ${has('eau')?`<div class="li"><span class="n">Eau plate / gazeuse<small>Still or sparkling water</small></span>${tk('eau')}</div>`:''}
    ${has('soda')?`<div class="li"><span class="n">Soda<small>Coca-Cola, Orangina, Ice Tea…</small></span>${tk('soda')}</div>`:''}
    ${has('ft')?`<div class="li"><span class="n">Fever-Tree<small>British tonic &amp; ginger</small></span>${tk('ft')}</div>`:''}
    ${has('beer')?`<div class="li"><span class="n">Bière en Eco Cup<small>dont ${eur(+P.cup)} de consigne, rendus au retour du verre</small></span><div class="tk"><b>${eur(+P.beer+(+P.cup||0))}</b></div></div>`:''}</div></div>`});
  S.push({h:carteHTML()});
  return S.filter(x=>x.h);
}
let SL=[],i=-1,last='';
function render(){
  SL=build();
  const h=SL.map((x,k)=>`<div class="sl ${x.full?'full':''}" data-k="${k}">${x.h}</div>`).join('');
  if(h===last)return;last=h;$('#show').innerHTML=h;$('#dots').innerHTML=SL.map(()=>'<i></i>').join('');
  if(i>=SL.length)i=-1;show(i<0?0:i)}
function show(k){i=k;const ft=document.getElementById('foot');if(ft)ft.hidden=k!==0;document.querySelectorAll('.sl').forEach(e=>e.classList.toggle('on',+e.dataset.k===i));
  document.querySelectorAll('#dots i').forEach((e,n)=>e.classList.toggle('on',n===i))}
function next(){if(SL.length)show((i+1)%SL.length)}
async function sync(){
  if(!PIN)return;
  try{const r=await fetch(SB_URL+'/rest/v1/rpc/fc_get_display',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pin:PIN})});
    if(!r.ok)return;const j=await r.json();const pz=j&&j.data&&j.data.prices;
    if(pz){P=Object.assign({},DEF,pz);render()}}catch(e){}
}
$('#go').onclick=async()=>{const v=$('#pin').value.trim();if(!v)return;
  try{const r=await fetch(SB_URL+'/rest/v1/rpc/fc_ping',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pin:v})});
    const role=await r.json();if(role==='refuse'){$('#err').textContent='Code incorrect';return}
    PIN=v;ls.set('fc-menu-pin',v);$('#cfg').hidden=true;sync()}catch(e){$('#err').textContent='Pas de réseau'}};
$('#skip').onclick=()=>{ls.set('fc-menu-pin','');PIN='';$('#cfg').hidden=true};
if(PIN===null)$('#cfg').hidden=false;
let wl;async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
['contextmenu','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('click',wake);

const MENTIONS=['Poissons issus de la pêche durable','Frites maison faites sur place','Pommes de terre du Nord','Produits locaux et de saison','Sauce tartare maison'];
let mi=0;function foot(){const el=$('#foot');el.style.opacity=0;setTimeout(()=>{el.textContent='✦  '+MENTIONS[mi++%MENTIONS.length]+'  ✦';el.style.opacity=1},1500)}
foot();setInterval(foot,7000);
/* Flocons de neige */
(function(){const c=$('#snow'),x=c.getContext('2d');let W,H,F=[];
  function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}
  rs();addEventListener('resize',rs);
  const N=Math.round(Math.min(90,innerWidth*innerHeight/14000));
  for(let k=0;k<N;k++)F.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.4,s:.15+Math.random()*.45,d:Math.random()*6.28,o:.35+Math.random()*.5});
  let last=performance.now();
  function f(now){const dt=Math.min(50,now-last)/16.7;last=now;x.clearRect(0,0,W,H);
    for(const p of F){p.y+=p.s*.0018*dt;p.d+=.01*dt;p.x+=Math.sin(p.d)*.0004*dt;if(p.y>1.02){p.y=-.02;p.x=Math.random()}
      x.beginPath();x.arc(p.x*W,p.y*H,p.r*devicePixelRatio,0,6.283);x.fillStyle=`rgba(255,250,240,${p.o})`;x.fill()}
    requestAnimationFrame(f)}
  requestAnimationFrame(f)})();
render();wake();sync();
setInterval(next,12000);setInterval(sync,60000);
</script>
